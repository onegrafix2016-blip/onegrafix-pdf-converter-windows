name: Build OneGrafix PDF Converter for Windows

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  windows-build:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: "x64"

      - name: Install Tesseract OCR
        shell: pwsh
        run: |
          choco install tesseract --yes --no-progress
          $command = Get-Command tesseract.exe -ErrorAction SilentlyContinue
          if ($command) {
            $candidate = Split-Path -Parent $command.Source
          } else {
            $candidate = "C:\Program Files\Tesseract-OCR"
          }
          if (!(Test-Path "$candidate\tesseract.exe")) {
            throw "Tesseract installation was not found. Check the Chocolatey package installation."
          }
          New-Item -ItemType Directory -Force -Path "runtime\tesseract" | Out-Null
          Copy-Item "$candidate\*" "runtime\tesseract\" -Recurse -Force
          if (!(Test-Path "runtime\tesseract\tessdata\eng.traineddata")) {
            throw "English OCR language data was not installed."
          }

      - name: Install Python dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Install LibreOffice for conversion smoke test
        shell: pwsh
        run: |
          choco install libreoffice-fresh --yes --no-progress

      - name: Run conversion tests
        shell: pwsh
        run: |
          python -m unittest discover -s tests -v

      - name: Build standalone Windows application
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --windowed `
            --name "OneGrafix PDF Converter" --icon "assets\onegrafix.ico" `
            --collect-all fitz `
            --collect-all pdfplumber `
            --collect-all pypdfium2 `
            --collect-all PySide6 `
            --collect-all pytesseract `
            app.py
          if (!(Test-Path "dist\OneGrafix PDF Converter\OneGrafix PDF Converter.exe")) {
            throw "PyInstaller did not create the application executable."
          }
          Copy-Item "runtime" "dist\OneGrafix PDF Converter\runtime" -Recurse -Force

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Compile Windows installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) {
            $iscc = "$env:ProgramFiles\Inno Setup 6\ISCC.exe"
          }
          if (!(Test-Path $iscc)) { throw "Inno Setup compiler not found." }
          Push-Location "installer"
          & $iscc "OneGrafixPDFConverter.iss"
          Pop-Location
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup compilation failed." }

      - name: Upload installer and portable build
        uses: actions/upload-artifact@v4
        with:
          name: OneGrafix-PDF-Converter-Windows-x64
          path: |
            installer/Output/*.exe
            dist/OneGrafix PDF Converter/
          if-no-files-found: error
          retention-days: 14
